<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinyal Kampus Realtime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        
        <div class="header-title">
            <h1>📶 Sinyal Kampus FTUI</h1>
            <p>Pantau jaringan & keramaian lokasi real-time</p>
        </div>

        <div class="card">
            
            <div class="form-group">
                <label for="lokasi-anda">📍 Lokasi Anda Saat Ini:</label>
                <select id="lokasi-anda" class="select-custom">
                    <option value="area_b201">Area B-201</option>
                    <option value="library_lt2">Library Lt. 2</option>
                    <option value="lobby_eng">Lobby Engineering</option>
                </select>
            </div>

            <!-- Tombol Cek -->
            <button id="btn-check" onclick="checkConnection()">⚡ Cek Koneksi & Kirim Data</button>

            <div class="card-header">
                <span>⚡ Live Network Status</span>
            </div>

            <div class="info-row">
                <span class="label">Signal</span>
                <span class="value" id="net-signal"><span class="status-badge status-good">Ready</span></span>
            </div>
            <div class="info-row">
                <span class="label">Latency</span>
                <span class="value" id="net-latency">-</span>
            </div>
            <div class="info-row">
                <span class="label">Packet Loss</span>
                <span class="value" id="net-loss">-</span>
            </div>
            <div class="info-row">
                <span class="label">Download</span>
                <span class="value" id="net-download">-</span>
            </div>
            
            <div class="readiness-section">
                <p class="section-title">Kualitas Ujian Online</p>
                <p class="stars" id="net-stars">⭐⭐⭐⭐⭐</p>
                <div class="alert alert-success" id="net-alert">
                    Tekan tombol di atas untuk tes jaringan & lokasi Anda.
                </div>
            </div>

            <!-- List Ruangan Realtime Firebase -->
            <div class="recommendation-section">
                <p class="section-title">📊 Status Area Real-Time:</p>
                <ul id="ruangan-list" style="padding: 0; margin: 0;">
                    <!-- Data Firebase dirender otomatis di sini -->
                </ul>
            </div>

        </div>
        
        <a href="admin.html" class="admin-link">Masuk Panel Admin →</a>
    </div>

    <!-- Firebase SDK -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script src="script.js"></script>
</body>
</html>
