<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Sinyal Kampus FTUI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 90vh;">
        <div class="card" style="width: 100%; max-width: 420px; text-align: center;">
            <p class="card-header" style="justify-content: center; margin-bottom: 12px;">&lt;/&gt; FTUI NETWORK ASSISTANT</p>
            
            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #fff;">Selamat Datang!</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5;">
                Masukkan nama Anda untuk memulai pengecekan kualitas jaringan dan kondisi keramaian di lingkungan FTUI.
            </p>
            
            <div class="form-group" style="text-align: left;">
                <label for="input-nama">Nama Lengkap / Panggilan:</label>
                <input type="text" id="input-nama" placeholder="Contoh: Angga" class="select-custom" required>
            </div>

            <button id="btn-check" onclick="masukAplikasi()" style="margin-top: 10px;">
                🚀 Masuk Aplikasi
            </button>
        </div>
    </div>

    <script>
        // Fungsi untuk mengecek input nama dan pindah ke halaman main.html
        function masukAplikasi() {
            const namaInput = document.getElementById('input-nama').value.trim();

            if (namaInput === "") {
                alert("Silakan masukkan nama Anda terlebih dahulu!");
                return;
            }

            // Menyimpan nama ke browser agar halaman main.html bisa menyapa nama mahasiswa
            localStorage.setItem('namaUser', namaInput);

            // Mengarahkan pengguna ke halaman utama pengecekan sinyal
            window.location.href = "main.html";
        }

        // Jalankan fungsi jika pengguna menekan tombol "Enter" di keyboard
        document.getElementById('input-nama').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                masukAplikasi();
            }
        });
    </script>
</body>
</html>
