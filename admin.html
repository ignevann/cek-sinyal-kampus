<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Secure Sinyal FTUI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-wrapper { width: 100%; max-width: 400px; margin: auto; margin-top: 10vh; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; }
        select, input { width: 100%; padding: 12px; font-size: 15px; border-radius: 8px; border: 1px solid #ccc; background: #fff; color: #333; box-sizing: border-box; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #007bff; text-decoration: none; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="admin-wrapper">
        
        <!-- KOTAK 1: AUTHENTICATION -->
        <div class="card" id="login-box">
            <div class="card-header">&lt;/&gt; ADMIN AUTHENTICATION</div>
            <h2>Masuk Panel Admin</h2>
            <div class="form-group">
                <label for="admin-pass">Masukkan Kata Sandi:</label>
                <input type="password" id="admin-pass" placeholder="Ketik kata sandi di sini...">
            </div>
            <button class="btn-primary" onclick="verifikasiLogin()">Login Admin</button>
            <p id="login-error" style="color: #c62828; text-align:center; font-size:14px; display:none; margin-top:10px; font-weight:bold;">⚠️ Password salah!</p>
        </div>

        <!-- KOTAK 2: PANEL UTAMA (TERSEMBUNYI DEFAULT) -->
        <div class="card" id="control-box" style="display: none;">
            <div class="card-header">&lt;/&gt; PANEL CONTROL AKTIF</div>
            <h2>Update Sinyal Kampus</h2>
            
            <div class="form-group">
                <label for="pilih-ruangan">Pilih Lokasi Kampus:</label>
                <select id="pilih-ruangan">
                    <option value="gedung_k_lt1">Gedung K Lantai 1</option>
                    <option value="gedung_k_lt2">Gedung K Lantai 2</option>
                    <option value="gedung_s_lt1">Gedung S Lantai 1</option>
                    <option value="gedung_s_lt6">Gedung S Lantai 6</option>
                    <option value="kantin_ftui">Kantin FTUI (Tektek)</option>
                    <option value="perpus_ftui">Perpustakaan FTUI</option>
                    <option value="lobby_mrc">Lobby MRC / Engineering Center</option>
                    <option value="auditorium_k301">Auditorium K.301</option>
                    <option value="gedung_dekanat">Gedung Dekanat FTUI</option>
                    <option value="gedung_g_gkb">Gedung G (Kuliah Bersama)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="pilih-status">Status Sinyal Baru:</label>
                <select id="pilih-status">
                    <option value="Good">Good (Bagus)</option>
                    <option value="Moderate">Moderate (Cukup)</option>
                    <option value="Poor">Poor (Buruk)</option>
                </select>
            </div>

            <button class="btn-primary" id="btn-update" onclick="updateSinyalFirebase()">Simpan Perubahan</button>
        </div>
        
        <a href="index.html" class="back-link">← Lihat Halaman Utama Mahasiswa</a>
    </div>

    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAgiiVozqnsuk5cSoxnf1ARAUW2CM_IPiQ",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://cek-koneksi-ftui-default-rtdb.firebaseio.com",
            projectId: "cek-koneksi-ftui",
            storageBucket: "cek-koneksi-ftui.firebasestorage.app",
            messagingSenderId: "739339154",
            appId: "1:739339154:web:a0b804ec40af66961def4b"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function verifikasiLogin() {
            const inputPass = document.getElementById('admin-pass').value;
            const passwordBenar = "adminftui2026"; // Ganti password di sini jika diinginkan

            if (inputPass === passwordBenar) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('control-box').style.display = 'block';
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function updateSinyalFirebase() {
            const ruanganId = document.getElementById('pilih-ruangan').value;
            const statusBaru = document.getElementById('pilih-status').value;
            const btn = document.getElementById('btn-update');

            if(btn) { btn.innerText = "Menyimpan..."; btn.disabled = true; }

            database.ref('ruangan/' + ruanganId).update({
                status: statusBaru
            })
            .then(() => {
                alert("Berhasil memperbarui data secara real-time!");
                if(btn) { btn.innerText = "Simpan Perubahan"; btn.disabled = false; }
            })
            .catch((error) => {
                alert("Gagal: " + error.message);
                if(btn) { btn.innerText = "Simpan Perubahan"; btn.disabled = false; }
            });
        }
    </script>
</body>
</html>
